:root{--verde:#5bbf3a;--verde-d:#3f9a26;--sol:#ffd43b;--sol-d:#eab000;--terra:#a6703c;
  --coral:#ff7a6b;--rosa:#ff8ac2;--roxo:#7d3fe0;--texto:#3a3020;--card:#fffdf6;--linha:#e6dcc6}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%;overflow:hidden}
body{font-family:"Fredoka",ui-rounded,"Segoe UI",system-ui,Arial,sans-serif;color:var(--texto);background:#bfe9ff;-webkit-user-select:none;user-select:none}
#bg{position:fixed;inset:0;z-index:0;background:#cdeeff center/cover no-repeat;background-image:url(img/jd_fundo.jpg)}
#ceu{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:1;pointer-events:none}
#app{position:fixed;inset:0;z-index:2}
.tela{position:absolute;inset:0;overflow-y:auto;-webkit-overflow-scrolling:touch;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-align:center;align-items:center;padding:calc(40px + env(safe-area-inset-top)) 16px calc(104px + env(safe-area-inset-bottom));-webkit-animation:fade .45s;animation:fade .45s}
@-webkit-keyframes fade{from{opacity:0}to{opacity:1}}@keyframes fade{from{opacity:0}to{opacity:1}}
.balao{position:relative;max-width:430px;background:rgba(255,253,246,.95);border:0;border-radius:22px;padding:13px 18px;font-size:17px;font-weight:600;text-align:center;line-height:1.35;
  -webkit-box-shadow:0 6px 18px rgba(30,50,20,.22);box-shadow:0 6px 18px rgba(30,50,20,.22)}
.balao b{color:#2c7318}
.centro{-webkit-box-flex:1;-webkit-flex:1;flex:1;display:-webkit-box;display:flex;-webkit-box-orient:vertical;-webkit-flex-direction:column;flex-direction:column;-webkit-box-pack:center;justify-content:center;-webkit-box-align:center;align-items:center;width:100%}
h1{font-size:34px;font-weight:700;color:#fff;margin:6px 0 2px;text-align:center;
  background:rgba(40,52,20,.78);padding:6px 18px;border-radius:20px;
  text-shadow:0 2px 0 #1e5410,0 4px 10px rgba(0,0,0,.45)}

.prato{background:rgba(255,255,255,.94);border:3px solid #cfe0b8;border-radius:50%;
  width:172px;height:172px;margin:14px 0;display:-webkit-box;display:-webkit-flex;display:flex;

/* ⭐ A LUPA NÃO CORTA MAIS (pedido do Marcos, ago/2026: "na atividade olhe de
   perto, não cortar as imagens dentro do quadrado"). O quadro tinha um
   scale(1.35) dentro de um overflow:hidden — o alimento aparecia grande, mas
   com as beiradas cortadas, e é justamente o FORMATO INTEIRO que a criança
   precisa olhar para dizer se é raiz, folha ou fruto. Agora o quadro é maior e
   a imagem entra INTEIRA (contain), sem zoom que corte nada.                */
.lupa2{background:rgba(255,255,255,.94);border:4px solid #b7d29a;border-radius:22px;
  width:212px;height:176px;margin:14px 0;display:-webkit-box;display:-webkit-flex;display:flex;
  -webkit-box-align:center;align-items:center;-webkit-box-pack:center;justify-content:center;

var anaNode=null,anaBuf=null,anaOk=false,anaTent=false,bocaAlvo=0,bocaSuave=0,falaTimer=0,falaAtual="",falandoCb=null;
function ligaAnalisador(){
  if(anaOk||anaTent)return; anaTent=true;
  try{ if(!ac)return; var src=ac.createMediaElementSource(narr); anaNode=ac.createAnalyser(); anaNode.fftSize=256;
    anaBuf=new Uint8Array(anaNode.fftSize); src.connect(anaNode); anaNode.connect(ac.destination); anaOk=true; }catch(e){}
}
function falar(id,cb){
  falandoCb=cb||null; falaAtual=id;
  if(ac&&ac.state==="suspended"){try{ac.resume();}catch(e){}}
  try{ narr.pause(); narr.currentTime=0; }catch(e){}
  narr.src="audio/"+id+".mp3";
  var p=narr.play(); if(p&&p["catch"]){ p["catch"](function(){}); }
  if(btnOuvir) btnOuvir.className="mini tocando";
  iniciaBoca();
}
function fimFala(){ paraBoca(); if(btnOuvir) btnOuvir.className="mini"; var c=falandoCb; falandoCb=null; if(c)c(); }
narr.addEventListener("ended",fimFala);
narr.addEventListener("error",function(){ fimFala(); });
function iniciaBoca(){ if(falaTimer)clearInterval(falaTimer); bocaAlvo=0.7;
  falaTimer=setInterval(function(){ if(narr.paused||narr.ended){bocaAlvo=0;} else if(!anaOk){ bocaAlvo=0.25+Math.random()*0.75; } },95); }
function paraBoca(){ if(falaTimer){clearInterval(falaTimer);falaTimer=0;} bocaAlvo=0; }
/* espera a fala acabar antes de seguir (prazo só vale se o áudio NÃO estiver tocando) */
function depoisDaFala(id,maxMs,cb){
  var fired=false;
  function fim(){ if(fired)return; fired=true; if(cb)cb(); }
  falar(id,fim);
  function guarda(){ if(fired)return; if(narr&&!narr.paused&&!narr.ended){ setTimeout(guarda,700); return; } fim(); }
  setTimeout(guarda,maxMs||6000);
}
/* loop do lip-sync: a boca do Broto segue a VOZ */
var brotoAtual=null;
function loopBoca(){
  if(anaOk&&!narr.paused&&!narr.ended){
    try{ anaNode.getByteTimeDomainData(anaBuf); var i,s=0;
      for(i=0;i<anaBuf.length;i+=4){ var v=(anaBuf[i]-128)/128; s+=v*v; }
      var rms=Math.sqrt(s/(anaBuf.length/4));
      bocaAlvo=(rms<0.012)?0:Math.min(1,0.18+rms*6);
    }catch(e){}
  }
  bocaSuave += (bocaAlvo-bocaSuave)*0.4;
  if(brotoAtual&&brotoAtual.fala){ brotoAtual.fala.style.opacity=bocaSuave.toFixed(3); }
  requestAnimationFrame(loopBoca);
}
requestAnimationFrame(loopBoca);

  if(!borbs.length){var k;for(k=0;k<3;k++)borbs.push({x:Math.random()*CW,y:CH*(0.18+Math.random()*0.35),ph:Math.random()*6,sp:0.25+Math.random()*0.4,c:["#ff8ac2","#ffd43b","#a56bff"][k]});}}

function poeZap(elm){
  var txt=elm.textContent;
  /* o texto pode TROCAR no mesmo elemento; por isso guardo o texto usado,
     e nao um sim/nao. */
  if(elm.__zaptxt===txt) return;
  elm.__zaptxt=txt;
  var velho=elm.getElementsByClassName("zap")[0];
  if(velho&&velho.parentNode) velho.parentNode.removeChild(velho);
  var k=temVoz(txt);
  if(!k) return;
  var bt=document.createElement("button");
  bt.className="zap"; bt.type="button";
  bt.setAttribute("aria-label","Ouvir esta resposta");
  bt.appendChild(document.createElement("i"));
  bt.appendChild(document.createElement("b"));

    if(ev&&ev.stopPropagation) ev.stopPropagation();

  };

/* ============ ⭐ A RODA DA PLANTA (o ciclo que nunca acaba) ============
   Diferente do "ordenar" que ja existe: ali a crianca enfileira o crescimento
   (linha reta). Aqui o crescimento e uma RODA com um buraco — e no fim ela
   descobre que depois do fruto vem semente OUTRA VEZ. O ciclo fechando e o

var RODA=[{img:"jd_g0",n:"SEMENTE"},{img:"jd_g1",n:"BROTO"},{img:"jd_g2",n:"PLANTA"},
          {img:"jd_g3",n:"FLOR"},{img:"jd_g4",n:"FRUTO"}];
function telaCiclo(){
  var rod=0,ordem=[3,1,4,0,2];   /* qual posicao fica vazia em cada rodada */

    limpa();var t=el("div","tela");setProg(t,34+rod);
    var vazio=ordem[rod],err=0,fim=false;
    var cen=el("div","centro");
    cen.appendChild(el("div","selo","A RODA DA PLANTA"));
    var bal=el("div","balao","Que parte da roda est&#225; <b>faltando</b>?");cen.appendChild(bal);
    var roda=el("div","roda"),i;
    for(i=0;i<RODA.length;i++){(function(k){
      var ang=(k/RODA.length)*2*Math.PI-Math.PI/2;
      var d=el("div","rpos");
      d.style.left=(50+Math.cos(ang)*39)+"%";
      d.style.top=(50+Math.sin(ang)*39)+"%";
      if(k===vazio){ d.className="rpos vaziopos"; d.innerHTML="?"; }
      else { d.appendChild(imgEl(RODA[k].img)); d.appendChild(el("span","rnome",RODA[k].n)); }
      roda.appendChild(d);
    })(i);}
    roda.appendChild(el("div","rseta",""));
    cen.appendChild(roda);
    var box=el("div","pcs"),ops=baguncar([vazio,(vazio+1)%5,(vazio+3)%5]),k2;
    for(k2=0;k2<ops.length;k2++){(function(idx){
      var b=el("div","pc",RODA[idx].n);
      b.onclick=function(){ arma();
        if(fim) return;
        if(idx===vazio){
          fim=true; b.className="pc usada"; sCerto(); reg("sequencia",err===0,err+1);
          var alvo=roda.getElementsByClassName("vaziopos")[0];
          if(alvo){ alvo.className="rpos"; alvo.innerHTML="";
            alvo.appendChild(imgEl(RODA[idx].img)); alvo.appendChild(el("span","rnome",RODA[idx].n));
            var ce=centroTela(alvo); faisca(ce[0],ce[1],"#8be05a",14); }
          setTimeout(function(){ rod++;
            if(rod>=ordem.length){ fecha(); } else passo();
          },1500);
        } else { err++; b.className="pc no"; sErro();
          setTimeout(function(){ if(b.className==="pc no") b.className="pc"; },440);
          ajudaJd(err,{dica:"Olhe o que vem <b>antes</b> e o que vem <b>depois</b> do buraco.",
                       revelar:function(){ var z,a=box.getElementsByClassName("pc");
                         for(z=0;z<a.length;z++) if(a[z].innerHTML===RODA[vazio].n) acendeJd(a[z]); }});
        }

    })(ops[k2]);}

      b.onclick=function(){ arma();
        if(fim) return;

          reg("sequencia",err===0,err+1);
          setTimeout(function(){ depoisDaFala("jd_ciclo_revela",13000,function(){
            mostraBanner("A semente vira planta, a planta vira fruto e no fruto tem <b>semente de novo</b>!",telaAquecimento); }); },900);
        } else { err++; b.className="pc no"; sErro();

/* ============ ⭐ MONTE O SEU PRATO (aplicar: comi que partes?) ============
   A crianca escolhe o almoco e o app vai carimbando de que parte veio cada
   alimento. Meta: 4 partes DIFERENTES no prato. E a fase que leva o conteudo
   para fora da tela — ela olha o prato de casa depois disso.                 */
/* ⭐ O PRATO TEM CINCO LUGARES (pedido do Marcos, ago/2026: "não permitir o
   aluno colocar mais de 5, para a comida não ficar de fora, que fica
   visualmente feio"). Antes dava para empilhar alimento sem conta e a comida
   transbordava do prato. Agora são CINCO lugares, e como a fase pede CINCO
   partes diferentes, cada lugar vale um alimento de uma parte — repetir parte
   custa um lugar. Para não haver beco sem saída, tocar num alimento que já
   está no prato TIRA ele de volta.                                          */
var MAXPRATO=5;
function telaPrato(){
  limpa();var t=el("div","tela");setProg(t,88);
  var noPrato=[],err=0,fim=false;
  var cen=el("div","centro");
  cen.appendChild(el("div","selo","MONTE O SEU PRATO"));
  var bal=el("div","balao","O prato tem <b>5 lugares</b>. Escolha alimentos de <b>5 partes diferentes</b> da planta.");
  cen.appendChild(bal);
  var prato=el("div","pratao"); cen.appendChild(prato);
  var marcas=el("div","pmarcas"); cen.appendChild(marcas);
  var box=el("div","comida"),i;
  function conta(){ var vis={},n=0,z;
    for(z=0;z<noPrato.length;z++){ if(!vis[noPrato[z].it.parte]){ vis[noPrato[z].it.parte]=1; n++; } }
    return [n,vis]; }
  function repinta(){
    var r=conta(),n=r[0],vis=r[1],z;
    marcas.innerHTML="";
    for(z in vis){ if(vis.hasOwnProperty(z)) marcas.appendChild(el("div","pmarca",nomeDe(z))); }
    if(fim) return;
    if(noPrato.length>=MAXPRATO&&n<5)
      bal.innerHTML="O prato encheu com <b>"+n+"</b> parte"+(n===1?"":"s")+
                    ". Toque num alimento <b>do prato</b> para tirar e trocar.";
    else
      bal.innerHTML="J&#225; tem <b>"+n+"</b> parte"+(n===1?"":"s")+" no prato. "+
                    (n>=5?"Prato completo!":"Falta"+((5-n)===1?"":"m")+" <b>"+(5-n)+"</b>.");
    if(n>=5&&!fim){ fim=true; sCerto(); sFesta(); festa(); reg("partes",err===0,err+1);
      setTimeout(function(){ depoisDaFala("jd_prato_revela",10000,function(){
        mostraBanner("Voc&#234; comeu a planta quase <b>inteira</b>: de raiz at&#233; semente!",telaQualParte); }); },1200);
    }
  }
  function tira(reg1){
    var z; for(z=0;z<noPrato.length;z++) if(noPrato[z]===reg1){ noPrato.splice(z,1); break; }
    if(reg1.img.parentNode) reg1.img.parentNode.removeChild(reg1.img);
    reg1.card.className="alim";
    sTap(); repinta();
  }
  for(i=0;i<COMER.length;i++){(function(it){
    var d=el("div","alim");
    d.appendChild(imgEl(it.img));
    d.appendChild(el("span","anome",it.nome));
    d.onclick=function(){ arma();
      if(fim) return;
      /* já está no prato? o toque TIRA (é o caminho de volta, sem beco) */
      var z; for(z=0;z<noPrato.length;z++) if(noPrato[z].card===d){ tira(noPrato[z]); return; }
      if(noPrato.length>=MAXPRATO){ sErro(); prato.className="pratao cheio";
        setTimeout(function(){ prato.className="pratao"; },520);
        bal.innerHTML="O prato tem s&#243; <b>5 lugares</b>. Toque num alimento <b>do prato</b> para tirar.";
        return; }
      d.className="alim posto"; sPop(noPrato.length);
      var im=imgEl(it.img); prato.appendChild(im);
      var reg1={it:it,img:im,card:d};
      noPrato.push(reg1);
      im.onclick=function(ev){ if(ev&&ev.stopPropagation) ev.stopPropagation(); if(!fim) tira(reg1); };
      var ce=centroTela(im); faisca(ce[0],ce[1],"#8be05a",12);
      repinta();
    };
    box.appendChild(d);
  })(COMER[i]);}
  cen.appendChild(box);
  cen.appendChild(el("div","hint","Toque para p&#244;r no prato. Tocou num do prato, ele volta."));
  t.appendChild(cen);app.appendChild(t);
  montaBarra("jd_prato_dica","Alimentos de partes diferentes.");
  falar("jd_prato_intro");
}

/* ---------- TREINAR SO O QUE FALTOU ----------
   Pergunta do Marcos (ago/2026): "se ela nao domina, ela consegue fazer so as
   atividades que nao domina?". Da: o app ja mede cada objetivo (DOM). Aqui ele
   monta um percurso CURTO so com as fases dos objetivos fracos e volta para a
   medalha no fim. A crianca nao repete o que ja sabe — isso e o que mantem ela
   na tarefa em vez de enjoar.
   Truque para nao mexer em nenhuma fase: enquanto o treino roda, o mostraBanner
   ignora o "proximo" original e chama a proxima fase da fila.               */
var FILATREINO=null;
var _bannerOriginal=mostraBanner;
mostraBanner=function(msg,cb){ _bannerOriginal(msg, FILATREINO ? proximoTreino : cb); };
function fracos(){
  var k,out=[];
  for(k in DOM){ if(DOM.hasOwnProperty(k)&&(DOM[k]||0)<0.75&&TREINO[k]) out.push(k); }
  return out;
}
function proximoTreino(){
  if(!FILATREINO||!FILATREINO.length){ FILATREINO=null; salvaEstado(); TELAFIM(); return; }
  var f=FILATREINO.shift();
  try{ f(); }catch(e){ proximoTreino(); }
}
function treinarFracos(){
  var f=fracos(),i,fila=[];
  for(i=0;i<f.length;i++) fila.push(TREINO[f[i]]);
  if(!fila.length){ TELAFIM(); return; }
  FILATREINO=fila; proximoTreino();
}
